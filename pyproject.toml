[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stockbot"
version = "0.1.0"
description = "Discord bot for Taiwan stock market monitoring and portfolio tracking."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "discord.py",
    "feedparser",
    "fugle-marketdata",
    "pandas",
    "python-dotenv",
]

[project.scripts]
stockbot = "stockbot.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
